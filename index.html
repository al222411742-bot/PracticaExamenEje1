<!--Ejercicio 1 SOLO CSS Y HTML

En este proyecto, deberás crear una interfaz de usuario sencilla que permita alternar entre varios
temas utilizando únicamente HTML y CSS. La interfaz debe ser básica: una fila con tres opciones
de tema y una tarjeta de vista previa con un título, un párrafo breve y un botón.
El cambio de tema debería funcionar sin JavaScript mediante botones de radio con etiquetas y
selectores -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 1 CON HTML Y CSS</title>
    <link rel="stylesheet" href="styleeje1.css">
</head>
<body>
    
<header>
  <h1 style="color: rgb(227, 10, 227); font-size: 32px; font-style: italic;   text-align: center; font-family: 'Times New Roman', Times, serif;">EJERCICIO 1 CON HTML Y CSS</h1>
    <center>
<input type="radio" name="tema" id="light" checked>
    <input type="radio" name="tema" id="dark">
    <input type="radio" name="tema" id="custom">

    <div class="tarjeta">

        <div class="opciones">
        <label for="light">Light</label>
        <label for="dark">Dark</label>
        <label for="custom">Custom</label>
        </div>

        <h1>Hola Mundooo!</h1>

        <p>
            Esta es un ejerciciol pequeño que cambia de color
        </p>

        <button>Boton inicial</button>
</center>
    </div>
</body>
</html>
